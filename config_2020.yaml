version: 0.8.0
tutorial: false

run:
  name: "2020_baseline" # Keeps your baseline results separate [1]

countries: ["KE"]

scenario:
  simpl: ['']
  ll: ['copt']
  clusters: [10]
  opts: [3h] 
  planning_horizons: [2020] # Sets the investment year to 2020 [1, 2]

clustering:
  spatial:
    clusters: [10]
  simplify_network:
    to_substations: false 
    remove_stubs: false
    algorithm: hac # <--- CHANGE 1: Switched from kmeans to hac
    feature: solar+onwind-time 
    exclude_carriers: []
    remove_stubs_across_borders: false
    p_threshold_drop_isolated: 0 # <--- CHANGE 2: Set to false
    p_threshold_merge_isolated: 500 # <--- CHANGE 3: Set to 500
    s_threshold_fetch_isolated: false 
  cluster_network:
    algorithm: hac # <--- CHANGE 1: Switched from kmeans to hac
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: false 
  distribute_cluster: ["load"] # Leave this as "load" to avoid the Python error!
  out_logging: true          # single-country run; focus_weights not needed
  aggregation_strategies:
    generators:
      p_nom: sum
      p_nom_max: sum
      p_nom_min: sum
      p_min_pu: mean
      p_max_pu: weighted_average
      marginal_cost: mean
      committable: any
      ramp_limit_up: max
      ramp_limit_down: max
      efficiency: mean


load_options:
  ssp: "ssp2-2.6"
  prediction_year: 2030 # Scales GDP/Population demand drivers to 2020 levels [3, 7]
  weather_year: 2013
  scale: 0.66

enable:
  retrieve_databundle: false
  download_osm_data: false
  build_natura_raster: false
  progress_bar: true
  build_cutouts: false
  retrieve_cost_data: true # Ensures costs_2020.csv is fetched [8, 9]

augmented_line_connection:
  add_to_snakefile: true  # If True, includes this rule to the workflow
  connectivity_upgrade: 2  # Min. lines connection per node, https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.connectivity.edge_augmentation.k_edge_augmentation.html#networkx.algorithms.connectivity.edge_augmentation.k_edge_augmentation
  new_line_type: ["HVAC"]  # Expanded lines can be either ["HVAC"] or ["HVDC"] or both ["HVAC", "HVDC"]
  min_expansion: 1  # [MW] New created line expands by float/int input
  min_DC_length: 600  # [km] Minimum line length of DC line


atlite:
  nprocesses: 4
  cutouts:
    cutout-2013-era5:
      module: era5

renewable:
  onwind:
    cutout: cutout-2013-era5
    resource:
      method: wind
      turbine: Vestas_V112_3MW
    capacity_per_sqkm: 3 # conservative, ScholzPhd Tab 4.3.1: 10MW/km^2
    natura: true
    potential: simple # or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  solar:
    cutout: cutout-2013-era5
    resource:
      method: pv
      panel: CSi
      orientation: latitude_optimal # will lead into optimal design
        # slope: 0.  # slope: 0 represent a flat panel
        # azimuth: 180.  # azimuth: 180 south orientation
    capacity_per_sqkm: 4.6 # From 1.7 to 4.6 addresses issue #361
    # Determined by comparing uncorrected area-weighted full-load hours to those
    # published in Supplementary Data to
    # Pietzcker, Robert Carl, et al. "Using the sun to decarbonize the power
    # sector: The economic potential of photovoltaics and concentrating solar
    # power." Applied Energy 135 (2014): 704-720.
    correction_factor: 0.854337
    natura: true
    potential: simple # or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  hydro:
    cutout: cutout-2013-era5
    resource:
      method: hydro
      hydrobasins: data/hydrobasins/hybas_af_lev06_v1c.shp
      flowspeed: 1.0  # m/s
      # weight_with_height: false
      # show_progress: true
    carriers: [ror, PHS, hydro]
    PHS_max_hours: 6
    hydro_max_hours: "energy_capacity_totals_by_country"  # not active
    clip_min_inflow: 1.0
    extendable: true
    normalization_multiplier: 1.1  # multiplier applied after the normalization of the hydro production


# Keep weather reference year at 2013 to match the databundle cutout [10]
snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: "left"

costs:
  year: 2020
  version: v0.5.0
  output_currency: "EUR"
  default_exchange_rate: 0.7532
  future_exchange_rate_strategy: "reference"
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.089

electricity:
  custom_powerplants: "replace"
  agg_p_nom_limits:
    file: data/agg_p_nom_minmax.csv
    include_existing: false 
  estimate_renewable_capacities:
    enable: false
    stats: false
    year: 2020 # Bounds your renewable capacities to exactly what existed in 2020 [4, 12]
    p_nom_min: 1.0      
    p_nom_max: false    
  technology_mapping:  
    Onshore: [onwind]
    PV: [solar]
  extendable_carriers:
    Generator: []
    StorageUnit: [battery]
    Store: [battery]

  conventional_carriers: [nuclear, oil, coal, lignite, geothermal, biomass]
  renewable_carriers: [solar, onwind, hydro]
  operational_reserve:
    activate: false
    epsilon_load: 0.10
  p_threshold_drop_isolated: 0.0
  p_threshold_merge_isolated: false
# Enforces the baseline emissions without 2030 reduction constraints [13, 14]

clean_osm_data_options:
  names_by_shapes: true
  threshold_voltage: 35000
  tag_substation: "transmission"
  add_line_endings: true
  generator_name_method: OSM
  use_custom_lines: "OSM_only"
  path_custom_lines: false
  use_custom_substations: "OSM_only"
  path_custom_substations: false
  use_custom_cables: "OSM_only"
  path_custom_cables: false

build_osm_network:
  group_close_buses: true
  group_tolerance_buses: 15000  # Increased to 15km. Snaps dead-end lines to nearby substations.
  split_overpassing_lines: true
  overpassing_lines_tolerance: 100
  force_ac: false

base_network:
  min_voltage_substation_offshore: 35000
  min_voltage_rebase_voltage: 35000

build_shape_options:
  gadm_layer_id: 1
  simplify_tolerance: 0.01
  simplify_gadm: true
  minarea: 0.01
  update_file: false
  out_logging: true
  year: 2020
  nprocesses: 3
  worldpop_method: "standard"
  gdp_method: "standard"
  contended_flag: "set_by_country"

lines:
  types:
    220.: "Al/St 240/40 2-bundle 220.0"
    300.: "Al/St 240/40 3-bundle 300.0"
    380.: "Al/St 240/40 4-bundle 380.0"
  dc_type: "DC_custom_linetype"
  s_max_pu: 0.7
  s_nom_max: .inf
  length_factor: 1.25
  under_construction: "zero" # 'zero': set capacity to zero, 'remove': remove, 'keep': with full capacity

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  include_tyndp: true
  under_construction: "zero" # 'zero': set capacity to zero, 'remove': remove, 'keep': with full capacity

transformers:
  x: 0.1
  s_nom: 2000.
  type: ""

solving:
  options:
    formulation: kirchhoff
    load_shedding: false
    noisy_costs: true
    min_iterations: 4
    max_iterations: 6
    clip_p_max_pu: 0.01
    skip_iterations: true
    track_iterations: false
    #nhours: 10
  solver:
    name: gurobi
    threads: 4
    method: 2 # barrier (=ipm)
    crossover: 0
    BarConvTol: 1.e-5
    FeasibilityTol: 1.e-6
    AggFill: 0
    PreDual: 0
    GURO_PAR_BARDENSETHRESH: 200

crs:
  geo_crs: EPSG:4326
  distance_crs: EPSG:3857
  area_crs: ESRI:54009

plotting:
  map:
    figsize: [7, 7]
    boundaries: [-10.2, 29, 35, 72]
    p_nom:
      bus_size_factor: 5.e+4
      linewidth_factor: 3.e+3

  costs_max: 800
  costs_threshold: 1

  energy_max: 15000.
  energy_min: -10000.
  energy_threshold: 50.

  vre_techs: ["onwind", "offwind-ac", "offwind-dc", "solar", "ror"]
  conv_techs: ["OCGT", "CCGT", "nuclear", "coal", "oil"]
  storage_techs: ["hydro+PHS", "battery", "H2"]
  load_carriers: ["AC load"]
  AC_carriers: ["AC line", "AC transformer"]
  link_carriers: ["DC line", "Converter AC-DC"]
  tech_colors:
    "onwind": "#235ebc"
